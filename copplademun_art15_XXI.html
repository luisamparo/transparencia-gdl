*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

.gx-hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;position:relative;z-index:1}

.gx-search-wrap{margin:0 0 12px}
.gx-search{position:relative;display:flex;align-items:center;background:var(--wh);border:1.5px solid var(--g200);border-radius:12px;box-shadow:var(--sh-sm);transition:border-color .15s,box-shadow .15s}

.gx-search input::-webkit-search-cancel-button{display:none}
.gx-clear{position:absolute;right:8px;width:34px;height:34px;border:0;background:var(--g100);color:var(--g600);border-radius:50%;font-size:19px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center;transition:background .14s;font-family:var(--fh)}
.gx-clear:hover{background:var(--g200);color:var(--g900)}

.gx-chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 2px 12px}

.gx-chip-f .n{font-family:var(--fm);font-size:11px;opacity:.85}
.gx-count{font-size:12px;color:var(--g600);font-weight:600;margin:0 2px 16px}

.gx-sum{list-style:none;cursor:pointer;padding:15px 20px;display:flex;align-items:center;gap:15px;user-select:none}

.gx-sum-ico{flex-shrink:0;width:42px;height:42px;border-radius:11px;background:var(--ac-soft);color:var(--ac-d);border:1px solid var(--ac-border);display:flex;align-items:center;justify-content:center}
.gx-sum-tx{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.gx-sum-t{font-size:15px;font-weight:800;color:var(--g900);letter-spacing:-.01em}
.gx-sum-tx small{font-size:11.5px;color:var(--g600);font-weight:500}
.gx-sum-n{flex-shrink:0;font-family:var(--fm);font-size:12px;font-weight:500;color:var(--ac-d);background:var(--ac-soft);border:1px solid var(--ac-border);padding:3px 10px;border-radius:20px}

.gx-acc-body{padding:9px 14px 14px;max-height:620px;overflow-y:auto}

.gx-row-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gx-yb{flex-shrink:0;font-family:var(--fm);font-size:11px;font-weight:500;color:var(--ac-d);background:var(--ac-soft);border:1px solid var(--ac-border);padding:2px 9px;border-radius:6px}

.gx-ley blockquote strong{color:var(--g900);font-style:normal;font-weight:700}
.gx-ley-fuente{margin-top:14px;font-size:11.5px;color:var(--g400);line-height:1.6;font-family:var(--fm)}

.gx-top:hover{background:var(--ac-d)}

  .gx-ley blockquote{padding:12px 14px;font-size:13px}.gx-ley{margin-bottom:64px}.gx-top{right:12px;bottom:12px;width:44px;height:44px}
}
@media (max-width:380px){.gx-hero{padding:18px 14px}.gx-hero h1{font-size:18px}.gx-hero-sub{font-size:13.5px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}html{scroll-behavior:auto}}

  function svg(name,sz){ return '<svg width="'+(sz||22)+'" height="'+(sz||22)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(ICO[name]||ICO.file2)+'</svg>'; }
  function chev(cls){ return '<svg class="'+cls+'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>'; }
  var PDFICO='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
  var XLSICO='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="17"/><line x1="16" y1="13" x2="8" y2="17"/></svg>';
  var DOCICO='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>';
  function docBtn(file){
    if(BROKEN[file.trim()]) return '<span class="gx-na">— no disponible en el origen</span>';
    var u=FB+encf(file); var ext=file.trim().split('.').pop().toLowerCase();
    if(ext==='pdf') return '<a class="gx-btn" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+PDFICO+'Ver PDF</a>';
    var v='https://view.officeapps.live.com/op/view.aspx?src='+encodeURIComponent(u);
    if(ext==='xlsx'||ext==='xls') return '<a class="gx-btn xls" href="'+esc(v)+'" target="_blank" rel="noopener noreferrer">'+XLSICO+'Vista previa</a>';
    return '<a class="gx-btn doc" href="'+esc(v)+'" target="_blank" rel="noopener noreferrer">'+DOCICO+'Vista previa</a>';
  }

  /* HERO */
  var meta=(CFG.meta||[]).map(function(m){ return '<span class="gx-chip'+(m.neutral?' neutral':'')+'">'+(m.b?'<b>'+esc(m.b)+'</b> ':'')+esc(m.t)+'</span>'; }).join('');
  document.getElementById('gxHero').innerHTML='<span class="gx-hero-tag">'+esc(CFG.tag)+'</span><h1>'+esc(CFG.h1)+' <em>'+esc(CFG.h1em)+'</em></h1><p class="gx-hero-sub">'+CFG.sub+'</p><div class="gx-hero-meta">'+meta+'</div>';
  document.getElementById('gxQ').setAttribute('placeholder', CFG.searchph||'Buscar…');

  /* CATS */
  var SECNAME={}; (CFG.cats||[]).forEach(function(c){ SECNAME[c.key]=c.t; });
  function rowHtml(it){
    var search=norm([it.year>0?it.year:'',it.label,(SECNAME[it.sec]||''),(it.extra||'')].join(' '));
    var tags=(it.year>0)?'<div class="gx-row-top"><span class="gx-yb">'+esc(it.year)+'</span></div>':'';
    return '<div class="gx-row" data-search="'+esc(search)+'"><div class="gx-row-main">'+tags+'<span class="gx-row-t">'+esc(it.label)+'</span></div>'+docBtn(it.file)+'</div>';
  }
  var host=document.getElementById('gxCats'); var html='';
  (CFG.cats||[]).forEach(function(c){
    var rows=DATA.filter(function(x){return x.sec===c.key;}).slice();
    if(c.sort==='label'){ rows.sort(function(a,b){return a.label<b.label?-1:(a.label>b.label?1:0);}); }
    else { rows.sort(function(a,b){ if((b.year||0)!==(a.year||0)) return (b.year||0)-(a.year||0); if((b.q||0)!==(a.q||0)) return (b.q||0)-(a.q||0); return a.label<b.label?-1:(a.label>b.label?1:0); }); }
    var body=''; rows.forEach(function(it){ body+=rowHtml(it); });
    html+='<details class="gx-acc" data-cat="'+esc(c.key)+'"'+(c.open?' open':'')+'>'+
      '<summary class="gx-sum"><span class="gx-sum-ico" aria-hidden="true">'+svg(c.ico)+'</span>'+
      '<span class="gx-sum-tx"><span class="gx-sum-t">'+esc(c.t)+'</span><small>'+esc(c.sub||'')+'</small></span>'+
      '<span class="gx-sum-n">'+rows.length+'</span>'+chev('gx-chev')+'</summary>'+
      '<div class="gx-acc-body">'+body+'</div></details>';
  });
  host.innerHTML=html;

  /* CHIPS */
  var chipsHost=document.getElementById('gxChips');
  var multi=(CFG.cats||[]).length>1;
  if(multi){
    var chh='<button type="button" class="gx-chip-f active" data-cat="all">Todos <span class="n">'+DATA.length+'</span></button>';
    (CFG.cats||[]).forEach(function(c){ var n=DATA.filter(function(x){return x.sec===c.key;}).length; chh+='<button type="button" class="gx-chip-f" data-cat="'+esc(c.key)+'">'+esc(c.t)+' <span class="n">'+n+'</span></button>'; });
    chipsHost.innerHTML=chh;
  } else { chipsHost.style.display='none'; }

  /* CIFRAS */
  document.getElementById('gxCifras').innerHTML=(CFG.cifras||[]).map(function(c){ return '<div class="gx-cifra"><div class="gx-cifra-num">'+esc(c.num)+'</div><div class="gx-cifra-lbl">'+esc(c.lbl)+'</div><div class="gx-cifra-sub">'+esc(c.sub||'')+'</div></div>'; }).join('');

  /* INFO (footer ciudadano) */
  document.getElementById('gxInfo').innerHTML=(CFG.info||[]).map(function(c){ return '<div class="gx-info-card"><div class="gx-info-ico" aria-hidden="true">'+svg(c.ico)+'</div><h3>'+esc(c.h)+'</h3><p>'+c.p+'</p></div>'; }).join('');

  /* LEY */
  var seal='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg>';
  document.getElementById('gxLey').innerHTML='<div class="gx-ley-head"><span class="gx-ley-seal" aria-hidden="true">'+seal+'</span><div><div class="gx-ley-eye">Fundamento legal</div><h3>¿Por qué el Ayuntamiento publica esta información?</h3></div></div>'+
    '<p>Es una obligación de transparencia. La ley ordena publicar, palabra por palabra, lo siguiente:</p>'+
    '<blockquote>'+CFG.blockquote+'</blockquote>'+
    '<p>— <strong>'+esc(CFG.leyref)+'</strong> de la <em>Ley de Transparencia y Acceso a la Información Pública del Estado de Jalisco y sus Municipios</em>. Los archivos de esta página son los oficiales, tal como fueron publicados por el sujeto obligado; ante cualquier discrepancia, prevalece el documento oficial.</p>'+
    '<div class="gx-ley-fuente">'+CFG.fuente+'</div>';

  /* MIG */
  if(CFG.mig){ var mg=document.getElementById('gxMig'); mg.style.display='flex'; mg.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg><span>'+CFG.mig+'</span>'; }

  /* BUSCADOR + FILTRO */
  var inp=document.getElementById('gxQ'), clearBtn=document.getElementById('gxClear'), box=document.querySelector('.gx-search');
  var count=document.getElementById('gxCount'), noRes=document.getElementById('gxNoRes'), noResQ=document.getElementById('gxNoResQ');
  var accs=[].slice.call(document.querySelectorAll('.gx-acc'));
  var items=[].slice.call(document.querySelectorAll('.gx-row'));
  var TOTAL=items.length, curCat='all', noun=CFG.noun||'documentos', firstOpen=(CFG.cats&&CFG.cats.length?(CFG.cats.filter(function(c){return c.open;})[0]||CFG.cats[0]).key:'');
  function apply(){
    var raw=inp.value.replace(/^\s+|\s+$/g,''); var toks=norm(raw).split(/\s+/).filter(Boolean);
    box.classList.toggle('has-q', raw.length>0); var vis=0;
    for(var i=0;i<items.length;i++){ var ds=items[i].getAttribute('data-search'),ok=true; for(var c=0;c<toks.length;c++){ if(ds.indexOf(toks[c])===-1){ok=false;break;} } items[i].classList.toggle('gone',!ok); }
    for(var d=0;d<accs.length;d++){
      var det=accs[d]; var okC=(curCat==='all')||(det.getAttribute('data-cat')===curCat);
      var its=det.querySelectorAll('.gx-row'),cnt=0; for(var k=0;k<its.length;k++){ if(!its[k].classList.contains('gone')) cnt++; }
      var show=okC && cnt>0; det.classList.toggle('hide',!show);
      if(show) vis+=cnt;
      if(show && (toks.length>0 || curCat!=='all')) det.open=true;
      else if(curCat==='all' && toks.length===0) det.open=(det.getAttribute('data-cat')===firstOpen);
    }
    if(toks.length===0 && curCat==='all'){ count.innerHTML='<b>'+TOTAL.toLocaleString('es-MX')+'</b> '+noun; noRes.className='gx-noresults'; }
    else if(vis===0){ count.innerHTML=''; noResQ.textContent='«'+raw+'»'; noRes.className='gx-noresults show'; }
    else { count.innerHTML='<b>'+vis.toLocaleString('es-MX')+'</b> de '+TOTAL.toLocaleString('es-MX')+' '+noun; noRes.className='gx-noresults'; }
    reportHeight();
  }
  inp.addEventListener('input', apply);
  clearBtn.addEventListener('click', function(){ inp.value=''; apply(); inp.focus(); });
  if(multi){ chipsHost.addEventListener('click', function(e){ var b=e.target.closest('.gx-chip-f'); if(!b) return; [].slice.call(this.querySelectorAll('.gx-chip-f')).forEach(function(x){x.classList.remove('active');}); b.classList.add('active'); curCat=b.getAttribute('data-cat'); apply(); }); }
  for(var ad=0;ad<accs.length;ad++){ accs[ad].addEventListener('toggle', reportHeight); }
  apply();

  var lastH=0;
  function reportHeight(){ var h=Math.max(document.body.scrollHeight,document.body.offsetHeight,document.documentElement.offsetHeight); if(h&&Math.abs(h-lastH)>1){ lastH=h; try{ parent.postMessage({type:'gdl-iframe-height',id:CFG.pmid,height:h},'*'); }catch(e){} } }
  window.addEventListener('load', reportHeight); window.addEventListener('resize', reportHeight);
  setTimeout(reportHeight,300); setTimeout(reportHeight,1000);
  var tb=document.getElementById('gxTopBtn');
  function sc(){ tb.classList.toggle('show',(window.pageYOffset||document.documentElement.scrollTop)>320); }
  window.addEventListener('scroll', sc, {passive:true});
  tb.addEventListener('click', function(){ var rm=window.matchMedia('(prefers-reduced-motion: reduce)').matches; window.scrollTo({top:0,behavior:rm?'auto':'smooth'}); }); sc();
})();
</script>
</body>
</html>
