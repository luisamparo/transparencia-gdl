.monto{font-weight:700;color:#333;}
.no-results{text-align:center;padding:40px;color:#888;}

}

function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  filtered = DATA.filter(r => {
    const tipoOk = !activeTipo || r[2] === activeTipo;
    const searchOk = !q || (r[0]+' '+r[1]+' '+r[2]+' '+r[3]+' '+r[4]+' '+r[5]+' '+r[6]).toLowerCase().includes(q);
    return tipoOk && searchOk;
  });
  if (sortCol >= 0 && sortDir !== 0) applySort();
  currentPage = 1;
  render();
}

function sortBy(col, type) {
  if (sortCol === col) {
    sortDir = sortDir === 1 ? -1 : (sortDir === -1 ? 0 : 1);
  } else {
    sortCol = col; sortDir = 1;
  }
  const ths = document.querySelectorAll('thead th');
  ths.forEach(th => {
    th.classList.remove('sort-asc','sort-desc');
    if (th.classList.contains('sortable')) th.classList.add('sort-none');
  });
  const thIdx = colToThIndex[col];
  if (sortDir !== 0 && thIdx !== undefined) {
    ths[thIdx].classList.remove('sort-none');
    ths[thIdx].classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
  }
  if (sortDir !== 0) { applySort(); } else { applyFilters(); return; }
  currentPage = 1;
  render();
}

function applySort() {
  filtered.sort((a, b) => {
    const av = a[sortCol], bv = b[sortCol];
    const cmp = (typeof av === 'number' && typeof bv === 'number')
      ? av - bv
      : String(av).localeCompare(String(bv), 'es', {sensitivity:'base'});
    return sortDir * cmp;
  });
}

function formatRow(r) {
  const sexoBadge = r[4] === 'Hombre'
    ? '<span class="badge badge-h">Hombre</span>'
    : r[4] === 'Mujer'
    ? '<span class="badge badge-m">Mujer</span>'
    : r[4];
  return '<tr>'
    +'<td>'+r[0]+'</td>'
    +'<td>'+r[1]+'</td>'
    +'<td>'+r[2]+'</td>'
    +'<td>'+r[3]+'</td>'
    +'<td>'+sexoBadge+'</td>'
    +'<td class="monto">'+r[5]+'</td>'
    +'<td>'+r[6]+'</td>'
    +'</tr>';
}

function render() {
  const tbody = document.getElementById('tableBody');
  const start = (currentPage - 1) * ROWS_PER_PAGE;
  const page = filtered.slice(start, start + ROWS_PER_PAGE);
  const totalPages = Math.max(1, Math.ceil(filtered.length / ROWS_PER_PAGE));
  tbody.innerHTML = page.map(formatRow).join('');
  document.getElementById('pageInfo').textContent =
    'Página ' + currentPage + ' de ' + totalPages + ' (' + filtered.length + ' registros)';
  document.getElementById('btnPrev').disabled = currentPage <= 1;
  document.getElementById('btnNext').disabled = currentPage >= totalPages;
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';
  document.getElementById('mainTable').style.display = filtered.length === 0 ? 'none' : '';
}

function changePage(dir) {
  const totalPages = Math.ceil(filtered.length / ROWS_PER_PAGE);
  currentPage = Math.min(Math.max(1, currentPage + dir), totalPages);
  render();
}

render();
</script>
</body>
