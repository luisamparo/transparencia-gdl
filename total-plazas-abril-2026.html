<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Total de Plazas - Abril 2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; background: #fff; }
  .container {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    border: 1px solid #e0e0e0;
  }
  .header {
    background-color: #F15A22;
    color: #ffffff;
    text-align: center;
    padding: 10px 16px;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 0.5px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    border-top: none;
  }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
    background: #ffffff;
    border: 1px solid #e8e8e8;
  }
  .card:nth-child(1) { border-right: 1px solid #e8e8e8; border-bottom: 1px solid #e8e8e8; }
  .card:nth-child(2) { border-bottom: 1px solid #e8e8e8; }
  .card:nth-child(3) { border-right: 1px solid #e8e8e8; }
  .number {
    font-size: 64px;
    font-weight: 900;
    color: #F15A22;
    line-height: 1;
    margin-bottom: 14px;
  }
  .label {
    font-size: 22px;
    font-weight: 700;
    color: #5a5a5a;
    line-height: 1.3;
    max-width: 260px;
  }
  .footer {
    text-align: right;
    padding: 6px 12px;
    font-size: 10px;
    color: #aaa;
    border-top: 1px solid #e8e8e8;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">Total de plazas</div>
  <div class="grid">
    <div class="card">
      <div class="number">3,358</div>
      <div class="label">Plazas de base ocupadas por hombres</div>
    </div>
    <div class="card">
      <div class="number">2,333</div>
      <div class="label">Plazas de base ocupadas por mujeres</div>
    </div>
    <div class="card">
      <div class="number">3,754</div>
      <div class="label">Plazas de confianza ocupadas por hombres</div>
    </div>
    <div class="card">
      <div class="number">1,716</div>
      <div class="label">Plazas de confianza ocupadas por mujeres</div>
    </div>
  </div>
  <div class="footer">Actualizado: 06/05/2026 &nbsp;|&nbsp; Periodo: Abril 2026</div>
</div>
</body>
</html>
