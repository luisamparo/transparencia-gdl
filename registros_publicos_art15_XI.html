<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="description" content="La información pública de los registros que opera el municipio de Guadalajara (Registro Civil y Catastro). Art. 15, Fracción XI de la Ley de Transparencia del Estado de Jalisco y sus Municipios."/>
<title>Registros públicos: Registro Civil y Catastro · Guadalajara · Art. 15 Frac. XI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

<style>
:root{
  --ac:#E87722;--ac-l:#FFE4CC;--ac-d:#C45F0A;--ac-deeper:#8B4308;--ac-border:#F5C99A;--ac-soft:#FFF1E4;
  --g50:#FAFAF8;--g100:#F0F0EC;--g200:#E2E2DD;--g300:#CFCFC8;--g400:#9E9E98;--g600:#5A5A55;--g800:#2D2D2A;--g900:#1A1A1A;
  --wh:#FFF;--ok:#16A34A;--ok-d:#0E6B4C;--ok-l:#DCFCE7;--ok-border:#A7E8C0;--bl:#1D4ED8;--bl-l:#DBE6FE;--bl-border:#BBD0F7;
  --rad:10px;--rad-lg:14px;--sh:0 4px 22px rgba(0,0,0,.08);--sh-sm:0 1px 3px rgba(0,0,0,.06);--sh-md:0 6px 18px rgba(0,0,0,.07);
  --ease:cubic-bezier(.4,0,.2,1);--fh:'Outfit',system-ui,-apple-system,sans-serif;--fm:'DM Mono','SF Mono',Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{margin:0;padding:24px;background:#f7f3ec;font-family:var(--fh);color:var(--g900);line-height:1.55;-webkit-font-smoothing:antialiased}
.gx-wrap{max-width:1040px;margin:0 auto}
.gx-hero{background:linear-gradient(135deg,var(--ac-soft) 0%,#FFFFFF 55%);border-radius:var(--rad-lg);padding:28px 32px;margin:0 0 20px;position:relative;overflow:hidden;border-left:5px solid var(--ac);box-shadow:0 2px 14px rgba(232,119,34,.10)}
.gx-hero::before{content:'';position:absolute;top:-66px;right:-66px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,rgba(232,119,34,.12) 0%,transparent 70%);pointer-events:none}
.gx-hero-tag{display:inline-block;background:var(--ac);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:5px 14px;border-radius:20px;margin-bottom:14px;position:relative;z-index:1;box-shadow:0 2px 6px rgba(232,119,34,.25)}
.gx-hero h1{margin:0 0 9px;font-size:clamp(22px,3.2vw,29px);font-weight:800;color:var(--g900);letter-spacing:-.018em;line-height:1.2;position:relative;z-index:1}
.gx-hero h1 em{font-style:normal;color:var(--ac-d);display:block;margin-top:3px}
.gx-hero-sub{font-size:14.5px;color:var(--g600);max-width:78ch;margin:0;line-height:1.62;position:relative;z-index:1}
.gx-hero-sub strong{color:var(--g900);font-weight:700}
.gx-hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;position:relative;z-index:1}
.gx-chip{display:inline-flex;align-items:center;gap:6px;background:var(--wh);border:1.5px solid var(--ac-border);color:var(--ac-d);font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:20px}
.gx-chip b{font-family:var(--fm);font-weight:500}
.gx-chip.neutral{border-color:var(--g200);color:var(--g600)}
.gx-search-wrap{margin:0 0 12px}
.gx-search{position:relative;display:flex;align-items:center;background:var(--wh);border:1.5px solid var(--g200);border-radius:12px;box-shadow:var(--sh-sm);transition:border-color .15s,box-shadow .15s}
.gx-search:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px rgba(232,119,34,.12)}
.gx-search>svg{position:absolute;left:15px;color:var(--g400);pointer-events:none}
.gx-search input{flex:1;width:100%;border:0;outline:0;background:transparent;font-family:var(--fh);font-size:14.5px;color:var(--g900);padding:13px 46px}
.gx-search input::placeholder{color:var(--g400)}
.gx-search input::-webkit-search-cancel-button{display:none}
.gx-clear{position:absolute;right:8px;width:34px;height:34px;border:0;background:var(--g100);color:var(--g600);border-radius:50%;font-size:19px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center;transition:background .14s;font-family:var(--fh)}
.gx-clear:hover{background:var(--g200);color:var(--g900)}
.gx-search.has-q .gx-clear{display:flex}
.gx-chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 2px 12px}
.gx-chip-f{font-family:var(--fh);font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:20px;border:1.5px solid var(--g200);background:var(--wh);color:var(--g600);cursor:pointer;transition:all .13s var(--ease);display:inline-flex;align-items:center;gap:7px}
.gx-chip-f:hover{border-color:var(--ac-border);color:var(--ac-d)}
.gx-chip-f.active{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 2px 6px rgba(232,119,34,.25)}
.gx-chip-f .n{font-family:var(--fm);font-size:11px;opacity:.85}
.gx-count{font-size:12px;color:var(--g600);font-weight:600;margin:0 2px 16px}
.gx-count b{color:var(--ac-d);font-family:var(--fm);font-weight:500}
.gx-acc{border:1.5px solid var(--g200);border-radius:var(--rad-lg);box-shadow:var(--sh-sm);background:var(--wh);overflow:hidden;margin-bottom:12px}
.gx-acc.hide{display:none}
.gx-sum{list-style:none;cursor:pointer;padding:15px 20px;display:flex;align-items:center;gap:15px;user-select:none}
.gx-sum::-webkit-details-marker{display:none}
.gx-sum-ico{flex-shrink:0;width:42px;height:42px;border-radius:11px;background:var(--ac-soft);color:var(--ac-d);border:1px solid var(--ac-border);display:flex;align-items:center;justify-content:center}
.gx-sum-tx{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.gx-sum-t{font-size:15px;font-weight:800;color:var(--g900);letter-spacing:-.01em}
.gx-sum-tx small{font-size:11.5px;color:var(--g600);font-weight:500}
.gx-sum-n{flex-shrink:0;font-family:var(--fm);font-size:12px;font-weight:500;color:var(--ac-d);background:var(--ac-soft);border:1px solid var(--ac-border);padding:3px 10px;border-radius:20px}
.gx-chev{flex-shrink:0;color:var(--g400);transition:transform .2s var(--ease)}
.gx-acc[open] .gx-chev{transform:rotate(180deg)}
.gx-acc[open]>.gx-sum{border-bottom:1px solid var(--g200);background:var(--g50)}
.gx-acc-body{padding:9px 14px 14px;max-height:620px;overflow-y:auto}
.gx-row{display:flex;align-items:center;gap:13px;padding:10px 13px;border-radius:9px;border:1px solid var(--g100);background:var(--g50);transition:border-color .14s,background .14s}
.gx-row+.gx-row{margin-top:6px}
.gx-row:hover{border-color:var(--ac-border);background:var(--wh)}
.gx-row.gone{display:none}
.gx-row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.gx-row-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gx-yb{flex-shrink:0;font-family:var(--fm);font-size:11px;font-weight:500;color:var(--ac-d);background:var(--ac-soft);border:1px solid var(--ac-border);padding:2px 9px;border-radius:6px}
.gx-row-t{font-size:13px;font-weight:700;color:var(--g900);letter-spacing:-.004em;line-height:1.4}
.gx-na{flex-shrink:0;font-size:11px;font-weight:700;color:var(--g400);font-style:italic;white-space:nowrap}
.gx-btn{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;font-family:var(--fh);font-size:12px;font-weight:700;padding:8px 14px;border-radius:9px;cursor:pointer;text-decoration:none;border:1.5px solid var(--ac);background:var(--ac);color:#fff;transition:all .14s var(--ease);white-space:nowrap}
.gx-btn:hover{background:var(--ac-d);border-color:var(--ac-d);transform:translateY(-1px)}
.gx-btn svg{flex-shrink:0}
.gx-btn.xls{background:var(--wh);color:var(--ok-d);border-color:var(--ok-border)}
.gx-btn.doc{background:var(--wh);color:var(--bl);border-color:var(--bl-border)}
.gx-noresults{display:none;background:var(--ac-soft);border:1.5px solid var(--ac-border);border-radius:var(--rad-lg);padding:22px 24px;font-size:13.5px;color:var(--g800);line-height:1.6;text-align:center;margin-top:4px}
.gx-noresults.show{display:block}
.gx-noresults strong{color:var(--ac-d);font-weight:700}
.gx-mig{display:flex;gap:11px;align-items:flex-start;background:var(--ac-soft);border:1px solid var(--ac-border);border-radius:var(--rad-lg);padding:14px 18px;margin:4px 0 0;font-size:12.5px;color:var(--g800);line-height:1.55}
.gx-mig svg{flex-shrink:0;color:var(--ac-d);margin-top:1px}
.gx-mig b{color:var(--g900);font-weight:700}
.gx-foot-title{font-size:12.5px;font-weight:800;color:var(--g800);letter-spacing:.1em;text-transform:uppercase;margin:34px 4px 16px;display:flex;align-items:center;gap:10px}
.gx-foot-title::after{content:'';flex:1;height:1.5px;background:var(--g200);border-radius:2px}
.gx-cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px;margin-bottom:4px}
.gx-cifra{background:var(--wh);border:1.5px solid var(--ac-border);border-radius:var(--rad);padding:16px 18px;display:flex;flex-direction:column;gap:2px;transition:border-color .18s,transform .18s}
.gx-cifra:hover{border-color:var(--ac);transform:translateY(-2px)}
.gx-cifra-num{font-family:var(--fm);font-size:30px;font-weight:700;line-height:1;color:var(--ac-d);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gx-cifra-lbl{font-size:11px;font-weight:700;color:var(--g800);text-transform:uppercase;letter-spacing:.06em;margin-top:6px;line-height:1.3}
.gx-cifra-sub{font-size:10.5px;color:var(--g400);margin-top:1px}
.gx-info{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.gx-info-card{background:var(--wh);border-radius:var(--rad-lg);box-shadow:var(--sh-sm);border-top:5px solid var(--ac);padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.gx-info-ico{width:40px;height:40px;border-radius:11px;background:var(--ac-soft);color:var(--ac-d);display:flex;align-items:center;justify-content:center;margin-bottom:2px}
.gx-info-card h3{font-size:14.5px;font-weight:800;color:var(--g900);letter-spacing:-.01em;line-height:1.3}
.gx-info-card p{font-size:12.5px;color:var(--g600);line-height:1.6}
.gx-info-card p strong{color:var(--g800);font-weight:700}
.gx-ley{background:var(--wh);border-radius:var(--rad-lg);padding:22px 26px;border-left:4px solid var(--ac-d);box-shadow:var(--sh-sm);margin-top:22px}
.gx-ley-head{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.gx-ley-seal{flex-shrink:0;width:46px;height:46px;border-radius:50%;background:var(--ac-soft);border:2px solid var(--ac);color:var(--ac-d);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(232,119,34,.18)}
.gx-ley-eye{font-size:10.5px;font-weight:800;color:var(--ac-d);letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}
.gx-ley h3{font-size:16px;font-weight:800;color:var(--g900);letter-spacing:-.008em;margin:0}
.gx-ley p{font-size:13px;color:var(--g600);line-height:1.65;max-width:80ch}
.gx-ley p+p{margin-top:7px}
.gx-ley p strong{color:var(--g800);font-weight:600}
.gx-ley blockquote{font-size:13.5px;color:var(--g600);line-height:1.65;margin:12px 0 8px;padding:13px 18px;background:var(--ac-soft);border-left:3px solid var(--ac);border-radius:6px;font-style:italic;max-width:80ch;overflow-wrap:anywhere}
.gx-ley blockquote strong{color:var(--g900);font-style:normal;font-weight:700}
.gx-ley-fuente{margin-top:14px;font-size:11.5px;color:var(--g400);line-height:1.6;font-family:var(--fm)}
.gx-top{position:fixed;right:18px;bottom:18px;z-index:60;width:46px;height:46px;border-radius:50%;border:0;background:var(--ac);color:#fff;box-shadow:0 6px 18px rgba(196,95,10,.38);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .18s,transform .18s,visibility .18s}
.gx-top.show{opacity:1;visibility:visible;transform:none}
.gx-top:hover{background:var(--ac-d)}
.gx-chip-f:focus-visible,.gx-btn:focus-visible,.gx-clear:focus-visible,.gx-top:focus-visible,.gx-sum:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(232,119,34,.45)}
@media (min-width:781px) and (max-width:1024px){body{padding:20px}.gx-hero{padding:26px 28px}.gx-ley{padding:20px 24px}}
@media (max-width:860px){.gx-info{grid-template-columns:1fr}}
@media (max-width:780px){body{padding:14px}.gx-hero{padding:22px 18px}.gx-ley{padding:18px 18px}}
@media (max-width:600px){
  body{padding:10px}
  .gx-hero{padding:18px 15px;border-radius:12px}.gx-hero h1{font-size:19px;line-height:1.24}.gx-hero-tag{font-size:9.5px;padding:4px 11px}
  .gx-sum{padding:14px 15px;gap:12px}.gx-sum-ico{width:38px;height:38px}.gx-sum-t{font-size:14px}.gx-acc-body{padding:7px 10px 12px;max-height:72vh}
  .gx-row{flex-direction:column;align-items:stretch;gap:10px}.gx-row .gx-btn{width:100%;justify-content:center;padding:12px 14px;font-size:13px}
  .gx-ley blockquote{padding:12px 14px;font-size:13px}.gx-ley{margin-bottom:64px}.gx-top{right:12px;bottom:12px;width:44px;height:44px}
}
@media (max-width:380px){.gx-hero{padding:18px 14px}.gx-hero h1{font-size:18px}.gx-hero-sub{font-size:13.5px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
